# 每次 push 到 dev / main，或向 main 发 PR 时，自动跑 pytest。
# 安装完整 requirements.txt，顺便检查依赖能否正常安装（和 Streamlit Cloud 部署一致）。
name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests
